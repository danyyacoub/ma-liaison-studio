<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Liaison">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ma Liaison Studio</title>
<style>
/* Layout: one full-screen black "story" surface like Instagram's story editor.
   Start screen = camera + library + recent photos; editor = 9:16 frame with floating controls. */
@font-face { font-family: "Kalam"; src: url("fonts/kalam-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
:root {
  --ink: #000000;
  --paper: #ffffff;
  --veil: rgba(0, 0, 0, 0.55);
  --chip: rgba(255, 255, 255, 0.16);
  --cream: #f3ede4;
  --gold: #c9a45c;
  --f-brand: "Didot", "Bodoni 72", "Cormorant Garamond", Georgia, serif;
  --f-ui: -apple-system, "Helvetica Neue", system-ui, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); font-family: var(--f-ui); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--ink); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); user-select: none; -webkit-user-select: none; }

/* start screen */
.start { justify-content: space-between; align-items: center; text-align: center; }
.start .brand { margin-top: 24px; font-family: var(--f-brand); font-style: italic; font-size: 34px; color: var(--cream); letter-spacing: .01em; }
.start .brand span { display: block; margin: 6px auto 0; width: 120px; height: 1px; background: var(--gold); }
.start p { margin: 0; padding-inline: 32px; color: rgba(255,255,255,.62); font-size: 15px; line-height: 1.45; max-width: 30ch; }
.start .mid { flex: 1; min-height: 0; width: 100%; max-width: 520px; display: flex; flex-direction: column; justify-content: center; padding-block: 12px; }
.recent { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-inline: 14px; }
.recent header { display: flex; justify-content: space-between; align-items: baseline; text-align: left; gap: 8px; }
.recent h2 { margin: 0; font-size: 15px; font-weight: 600; }
.recent header small { color: rgba(255,255,255,.55); font-size: 12px; }
.rgrid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; align-content: start; }
.rcell { position: relative; aspect-ratio: 9 / 16; border-radius: 6px; background: #222 center / cover no-repeat; }
.rcell .badge { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.3); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.rcell[aria-pressed="true"] .badge { background: #3897f0; border-color: #3897f0; }
.rcell[aria-pressed="true"]::after { content: ""; position: absolute; inset: 0; border-radius: 6px; background: rgba(255,255,255,.18); }
.ractions { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.ghost { padding: 10px 14px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: 14px; }
.start .controls { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 0 30px; }
.libbtn { justify-self: center; display: grid; justify-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); }
.libbtn i { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--paper); display: grid; place-items: center; }
.shutter { width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--paper); display: grid; place-items: center; }
.shutter::after { content: ""; width: 64px; height: 64px; border-radius: 50%; background: var(--paper); transition: transform .12s; }
.shutter:active::after { transform: scale(.9); }
.shutlabel { display: block; margin-top: 8px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); }

/* editor */
.stagebox { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px 8px 0; }
.frame { position: relative; border-radius: 14px; overflow: hidden; background: #111; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px; pointer-events: none; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0)); }
.topbar > * { pointer-events: auto; }
.topbar .right { display: flex; gap: 10px; }
.ico { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.38); display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.aa { font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.trash { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); background: rgba(0,0,0,.35); display: grid; place-items: center; transition: transform .12s, background .12s; pointer-events: none; }
.trash.hot { transform: translateX(-50%) scale(1.25); background: #e5484d; border-color: #e5484d; }
.trash svg { width: 24px; height: 24px; }
.bottombar { height: 76px; display: flex; align-items: center; gap: 10px; padding-inline: 12px; }
.strip { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; align-items: center; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.thumb { flex: 0 0 auto; width: 34px; height: 60px; border-radius: 6px; background: #222 center / cover no-repeat; border: 2px solid transparent; position: relative; }
.thumb[aria-current="true"] { border-color: var(--paper); }
.thumb .v { position: absolute; right: 2px; bottom: 1px; font-size: 9px; text-shadow: 0 0 3px #000; }
.addmore { flex: 0 0 auto; width: 34px; height: 60px; border-radius: 6px; border: 1.5px dashed rgba(255,255,255,.55); display: grid; place-items: center; font-size: 22px; font-weight: 400; color: rgba(255,255,255,.8); }
.sharebtn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 15px; padding: 12px 18px; border-radius: 999px; }
.sharebtn svg { width: 16px; height: 16px; }

/* text editor overlay: tabs and options sit at the top so the keyboard never covers them */
.texted { position: fixed; inset: 0; background: var(--veil); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); z-index: 10; }
.texted .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; }
.tabs { display: flex; gap: 4px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
.tabs button { padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
.texted .done { font-weight: 600; font-size: 17px; padding: 8px 6px; }
.opts { display: flex; gap: 8px; padding: 6px 12px 8px; overflow-x: auto; scrollbar-width: none; align-items: center; min-height: 44px; }
.opts::-webkit-scrollbar { display: none; }
.opts button.chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: var(--chip); font-size: 15px; white-space: nowrap; }
.opts button.chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.opts button.sw { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); }
.opts button.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--paper); }
.texted .mid { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px 16px; overflow: auto; }
#edPreview { width: min(92vw, 460px); max-height: 46%; object-fit: contain; flex: 0 1 auto; pointer-events: none; }
#edText { display: inline-block; min-width: 4ch; max-width: 86vw; text-align: center; font-size: 26px; line-height: 1.2; padding: 8px 18px; border-radius: 14px; outline: none; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: var(--paper); caret-color: var(--paper); }
#edText:empty::before { content: attr(data-ph); opacity: .45; }
.edhint { text-align: center; font-size: 12px; color: rgba(255,255,255,.65); padding: 0 16px 6px; min-height: 16px; }

/* action sheet + busy + toast */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.sheet .box { width: 100%; max-width: 420px; display: grid; gap: 8px; }
.sheet .grp { background: #2a2a2c; border-radius: 14px; overflow: hidden; display: grid; }
.sheet .grp p { margin: 0; padding: 14px 16px 10px; font-size: 13px; color: rgba(255,255,255,.6); text-align: center; }
.sheet .grp button { padding: 16px; font-size: 17px; border-top: 1px solid rgba(255,255,255,.1); color: #4ea1ff; }
.sheet .grp button.red { color: #ff6961; }
.sheet .grp button.bold { font-weight: 600; }
.sheet .cancel { background: #2a2a2c; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 600; color: #4ea1ff; }
#busy { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: grid; place-items: center; z-index: 30; padding-inline: 24px; }
#busy .box { width: min(300px, 100%); display: grid; gap: 12px; text-align: center; }
#busy .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
#busy .bar i { display: block; height: 100%; width: 0; background: var(--paper); }
#busy small { color: rgba(255,255,255,.6); }
#busy button { justify-self: center; padding: 8px 16px; border-radius: 999px; background: var(--chip); font-weight: 600; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: rgba(40,40,42,.95); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .shutter::after, .trash { transition: none; } }
</style>
</head>
<body>

<input id="camIn" type="file" accept="image/*,video/*" capture="environment" hidden>
<input id="libIn" type="file" accept="image/*,video/*" multiple hidden>

<section class="screen start" id="startScreen">
  <div class="brand">Ma Liaison<span></span></div>
  <div class="mid">
    <p id="intro" style="align-self:center">Take a photo or video of the item, or pick some from your library. Several photos make a TikTok slideshow.</p>
    <div class="recent" id="recent" hidden>
      <header><h2>Recent photos</h2><small id="recentHint">Tap photos to pick them for a TikTok slideshow</small></header>
      <div class="rgrid" id="rgrid"></div>
      <div class="ractions" id="ractions" hidden>
        <button class="ghost" id="rDelete">Delete</button>
        <button class="sharebtn" id="rShare">Share</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="libbtn" id="libBtn" aria-label="Choose from library">
      <i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></i>
      Library
    </button>
    <div><button class="shutter" id="camBtn" aria-label="Open camera"></button><span class="shutlabel">Camera</span></div>
    <span></span>
  </div>
</section>

<section class="screen" id="editScreen" hidden>
  <div class="stagebox" id="stagebox">
    <div class="frame" id="frame">
      <canvas id="stage" width="1080" height="1920" aria-label="Story. Drag the price to move it, pinch to resize or turn it, pinch the picture to zoom."></canvas>
      <div class="topbar">
        <button class="ico" id="closeBtn" aria-label="Discard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="right">
          <button class="ico" id="soundBtn" aria-label="Sound" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundWaves" d="M23 9l-6 6M17 9l6 6"/></svg>
          </button>
          <button class="ico aa" id="textBtn" aria-label="Price">Aa</button>
        </div>
      </div>
      <div class="trash" id="trash" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </div>
    </div>
  </div>
  <div class="bottombar">
    <div class="strip" id="strip"></div>
    <button class="sharebtn" id="shareBtn">Share
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<section class="texted" id="textEd" hidden>
  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Price options">
      <button role="tab" data-tab="font" aria-selected="true">Font</button>
      <button role="tab" data-tab="design" aria-selected="false">Style</button>
      <button role="tab" data-tab="color" aria-selected="false">Color</button>
      <button role="tab" data-tab="anim" aria-selected="false">Motion</button>
    </div>
    <button class="done" id="doneBtn">Done</button>
  </div>
  <div class="opts" id="opts" role="group"></div>
  <div class="edhint" id="edHint"></div>
  <div class="mid"><canvas id="edPreview" width="1080" height="640" aria-hidden="true"></canvas><div id="edText" contenteditable="true" data-ph="135$" role="textbox" aria-multiline="true" aria-label="Price text"></div></div>
</section>

<div class="sheet" id="sheet" hidden><div class="box"><div class="grp" id="sheetGrp"></div><button class="cancel" id="sheetCancel">Cancel</button></div></div>
<div id="busy" hidden><div class="box"><strong id="busyTitle">Preparing video</strong><div class="bar"><i id="busyBar"></i></div><small id="busyNote">Keep this screen open.</small><button id="busyCancel">Cancel</button></div></div>
<div id="toast" hidden></div>

<script>
(() => {
  const W = 1080, H = 1920;
  // Meta app ID for one-tap Instagram Stories in the iPhone app (developers.facebook.com, free).
  const META_APP_ID = '';
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const stage = $('#stage');
  const ctx = stage.getContext('2d');
  let uid = 0;

  const Cap = window.Capacitor;
  const NATIVE = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.nativePromise);
  const call = (plugin, method, opts) => Cap.nativePromise(plugin, method, opts || {});

  // ---------- design system for the price ----------
  // iPhone system fonts first; the fallbacks only matter in a desktop browser.
  const FONTS = {
    story: { label: 'Story', style: 'italic', weight: 400, family: 'Kalam, "Bradley Hand", cursive', k: 1 },
    helvetica: { label: 'Helvetica', style: 'normal', weight: 300, family: '"Helvetica Neue", Helvetica, Arial, sans-serif', k: 1 },
    helveticaMd: { label: 'Helvetica Medium', style: 'normal', weight: 500, family: '"Helvetica Neue", Helvetica, Arial, sans-serif', k: 1 },
    avenir: { label: 'Avenir', style: 'normal', weight: 500, family: '"Avenir Next", Avenir, "Segoe UI", sans-serif', k: 1 },
    futura: { label: 'Futura', style: 'normal', weight: 500, family: 'Futura, "Trebuchet MS", sans-serif', k: 1 },
    didot: { label: 'Didot', style: 'italic', weight: 400, family: 'Didot, "Bodoni 72", Georgia, serif', k: 1.08 },
    bodoni: { label: 'Bodoni', style: 'normal', weight: 400, family: '"Bodoni 72", Didot, Georgia, serif', k: 1.08 },
    optima: { label: 'Optima', style: 'normal', weight: 400, family: 'Optima, Candara, sans-serif', k: 1 },
    snell: { label: 'Snell', style: 'normal', weight: 400, family: '"Snell Roundhand", "Brush Script MT", cursive', k: 1.15 },
    savoye: { label: 'Savoye', style: 'normal', weight: 400, family: '"Savoye LET", "Snell Roundhand", cursive', k: 1.55 },
    noteworthy: { label: 'Noteworthy', style: 'normal', weight: 300, family: 'Noteworthy, "Bradley Hand", cursive', k: 1.05 },
    typewriter: { label: 'Typewriter', style: 'normal', weight: 400, family: '"American Typewriter", "Courier New", monospace', k: 0.95 },
  };
  const DESIGNS = {
    pill: 'Pill', tag: 'Tag', sale: 'Sale', badge: 'Badge', ribbon: 'Ribbon', label: 'Label', outline: 'Outline', glass: 'Glass', plain: 'Text only',
  };
  const DESIGN_HINT = {
    sale: 'First line is the old price (crossed out), next line the new price',
    label: 'First line is the brand, next line the price',
    badge: 'Works best with a short price or a discount like −40%',
  };
  const COLORS = {
    black: { bg: '#0b0b0b', fg: '#ffffff', label: 'Black' },
    white: { bg: '#ffffff', fg: '#111111', label: 'White' },
    cream: { bg: '#f3ede4', fg: '#2a2420', label: 'Cream' },
    gold: { bg: '#c9a45c', fg: '#ffffff', label: 'Gold', gradient: ['#a8792c', '#e8cd8a', '#b88a3c'] },
    blush: { bg: '#f6cdd6', fg: '#3a1d26', label: 'Blush' },
    red: { bg: '#d7263d', fg: '#ffffff', label: 'Sale red' },
    navy: { bg: '#1d2b4f', fg: '#ffffff', label: 'Navy' },
    green: { bg: '#1f4d3a', fg: '#ffffff', label: 'Green' },
    lilac: { bg: '#cdbbe9', fg: '#2b2140', label: 'Lilac' },
  };
  const ANIMS = { none: 'Still', pop: 'Pop', pulse: 'Pulse', bounce: 'Bounce', float: 'Float', wiggle: 'Wiggle', slide: 'Slide in' };
  const PERIOD = { pop: 3, slide: 3, pulse: 2.6, bounce: 1.7, float: 2.6, wiggle: 2.2 };
  const ANIM_SECONDS = 5;

  // Same curves as motion() in ios/App/App/MaLiaisonPlugin.swift, so preview and export match.
  const easeOutBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  function motion(kind, t) {
    const m = { s: 1, dx: 0, dy: 0, r: 0, a: 1 };
    if (kind === 'pop') { const p = Math.min(t / 0.45, 1); m.s = p < 1 ? Math.max(0.001, easeOutBack(p)) : 1; m.a = Math.min(1, t / 0.15); }
    else if (kind === 'pulse') m.s = 1 + 0.07 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / 1.3));
    else if (kind === 'bounce') m.dy = -38 * Math.abs(Math.sin(Math.PI * t / 0.85));
    else if (kind === 'float') { m.dy = 14 * Math.sin(2 * Math.PI * t / 2.6); m.r = 0.035 * Math.sin(2 * Math.PI * t / 2.6 + 1.2); }
    else if (kind === 'wiggle') { const ph = t % 2.2; m.r = ph < 0.6 ? 0.13 * Math.sin(ph * 2 * Math.PI * 5) * (1 - ph / 0.6) : 0; }
    else if (kind === 'slide') { const p = Math.min(t / 0.55, 1); const e = 1 - Math.pow(1 - p, 3); m.dx = -(1 - e) * 700; m.a = Math.min(1, p * 1.5); }
    return m;
  }

  const state = { items: [], cur: -1, editing: null, tab: 'font', style: { font: 'story', design: 'pill', color: 'black', anim: 'none' } };
  const cur = () => state.items[state.cur] || null;
  let dirty = true;
  const touch = () => { dirty = true; };

  // ---------- drawing ----------
  function mediaSize(el) {
    if (el.videoWidth) return [el.videoWidth, el.videoHeight];
    return [el.naturalWidth || el.width, el.naturalHeight || el.height];
  }
  const blurC = document.createElement('canvas');
  blurC.width = 18; blurC.height = 32;
  const bctx = blurC.getContext('2d');

  function baseScale(el) { const [mw, mh] = mediaSize(el); return Math.min(W / mw, H / mh); }
  function coverZoom(el) { const [mw, mh] = mediaSize(el); return Math.max(W / mw, H / mh) / Math.min(W / mw, H / mh); }
  // Where the picture sits in the 1080x1920 story (also sent to the iPhone video exporter).
  function mediaRect(item, el) {
    const [mw, mh] = mediaSize(el);
    const s = baseScale(el) * item.zoom;
    const dw = mw * s, dh = mh * s;
    const mx = Math.max(0, (dw - W) / 2) + W * 0.25, my = Math.max(0, (dh - H) / 2) + H * 0.25;
    item.pan.x = clamp(item.pan.x, -mx, mx);
    item.pan.y = clamp(item.pan.y, -my, my);
    return { x: (W - dw) / 2 + item.pan.x, y: (H - dh) / 2 + item.pan.y, w: dw, h: dh, blur: dw < W - 1 || dh < H - 1 };
  }
  function drawBackground(c, item, el) {
    c.fillStyle = '#000';
    c.fillRect(0, 0, W, H);
    const [mw, mh] = mediaSize(el);
    if (!mw || !mh) return;
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
    const r = mediaRect(item, el);
    if (r.blur) {
      const bs = Math.max(blurC.width / mw, blurC.height / mh);
      bctx.drawImage(el, (blurC.width - mw * bs) / 2, (blurC.height - mh * bs) / 2, mw * bs, mh * bs);
      c.drawImage(blurC, 0, 0, W, H);
      c.fillStyle = 'rgba(0,0,0,.2)';
      c.fillRect(0, 0, W, H);
    }
    c.drawImage(el, r.x, r.y, r.w, r.h);
  }

  function fontFor(f, size) {

  async function exportImage(item, i) {
    const c = document.createElement('canvas');

  // A sticker on its own transparent PNG (upright, no motion), for the iPhone video exporter.

    probe.save(); const [w, h] = drawDesign(probe, { ...st }); probe.restore();

  function pickMime() {

  // ---------- iPhone app bridge ----------
  function b64(blob) {

  async function blobToCache(blob, name) {
    const path = `share/${Date.now()}-${name}`;
    const CH = 3 * 1024 * 1024;
    if (!blob.size) await call('Filesystem', 'writeFile', { path, data: '', directory: 'CACHE', recursive: true });
    for (let off = 0; off < blob.size; off += CH) {
      const data = await b64(blob.slice(off, off + CH));
      if (off === 0) await call('Filesystem', 'writeFile', { path, data, directory: 'CACHE', recursive: true });

    acts.push({ label: 'Instagram Story', fn: () => shareCurrent('instagram') });
    acts.push({ label: 'TikTok', fn: () => shareCurrent('tiktok') });
    acts.push({ label: 'WhatsApp', fn: () => shareCurrent('whatsapp') });
    if (photos > 1) acts.push({ label: `All ${photos} photos to TikTok (slideshow)`, fn: shareAllPhotos });
    if (NATIVE) acts.push({ label: 'Save to Photos', fn: () => shareCurrent('photos') });
    sheet(animated(cur()) && cur().kind === 'image' ? 'The moving price turns this photo into a 5 second video.' : null, acts);
  };

  // ---------- start ----------
  renderRecent();
  requestAnimationFrame(loop);
  if (document.fonts) {
    Promise.all(Object.keys(FONTS).map((k) => document.fonts.load(fontFor(k, 72)))).then(touch).catch(() => {});
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
