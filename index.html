<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Liaison">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ma Liaison Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Courier+Prime&family=Dancing+Script:wght@500&family=Jost:wght@400&family=Kalam:wght@300;400&family=Manrope:wght@500;600;700;800&family=Oswald:wght@500&display=swap">
<style>
/* Layout: one full-screen black "story" surface like Instagram's story editor.
   Start screen = camera + library; editor = 9:16 frame with floating controls, bottom bar with Share. */
:root {
  --ink: #000000;
  --paper: #ffffff;
  --veil: rgba(0, 0, 0, 0.55);
  --chip: rgba(255, 255, 255, 0.16);
  --cream: #f3ede4;
  --gold: #c9a45c;
  --f-brand: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); font-family: var(--f-ui); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--ink); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); user-select: none; -webkit-user-select: none; }

/* start screen */
.start { justify-content: space-between; align-items: center; text-align: center; }
.start .brand { margin-top: 28px; font-family: var(--f-brand); font-style: italic; font-weight: 600; font-size: 34px; color: var(--cream); letter-spacing: .01em; }
.start .brand span { display: block; margin: 6px auto 0; width: 120px; height: 1px; background: var(--gold); }
.start p { margin: 0; padding-inline: 32px; color: rgba(255,255,255,.62); font-size: 15px; line-height: 1.45; max-width: 30ch; }
.start .controls { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 0 34px; }
.libbtn { justify-self: center; display: grid; justify-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); }
.libbtn i { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--paper); display: grid; place-items: center; }
.shutter { width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--paper); display: grid; place-items: center; }
.shutter::after { content: ""; width: 64px; height: 64px; border-radius: 50%; background: var(--paper); transition: transform .12s; }
.shutter:active::after { transform: scale(.9); }
.shutlabel { display: block; margin-top: 8px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); }

.start .mid { flex: 1; min-height: 0; width: 100%; max-width: 520px; display: flex; flex-direction: column; justify-content: center; padding-block: 12px; }
.recent { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-inline: 14px; }
.recent header { display: flex; justify-content: space-between; align-items: baseline; text-align: left; }
.recent h2 { margin: 0; font-size: 15px; font-weight: 700; }
.recent header small { color: rgba(255,255,255,.55); font-size: 12px; }
.rgrid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; align-content: start; }
.rcell { position: relative; aspect-ratio: 9 / 16; border-radius: 6px; background: #222 center / cover no-repeat; }
.rcell .badge { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.3); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.rcell[aria-pressed="true"] .badge { background: #3897f0; border-color: #3897f0; }
.rcell[aria-pressed="true"]::after { content: ""; position: absolute; inset: 0; border-radius: 6px; background: rgba(255,255,255,.18); }
.ractions { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.ractions .ghost { padding: 10px 14px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: 14px; }

/* editor */
.stagebox { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px 8px 0; }
.frame { position: relative; border-radius: 14px; overflow: hidden; background: #111; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px; pointer-events: none; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0)); }
.topbar > * { pointer-events: auto; }
.topbar .right { display: flex; gap: 10px; }
.ico { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.38); display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.aa { font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
.trash { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); background: rgba(0,0,0,.35); display: grid; place-items: center; transition: transform .12s, background .12s; pointer-events: none; }
.trash.hot { transform: translateX(-50%) scale(1.25); background: #e5484d; border-color: #e5484d; }
.trash svg { width: 24px; height: 24px; }
.bottombar { height: 76px; display: flex; align-items: center; gap: 10px; padding-inline: 12px; }
.strip { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; align-items: center; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.thumb { flex: 0 0 auto; width: 34px; height: 60px; border-radius: 6px; background: #222 center / cover no-repeat; border: 2px solid transparent; position: relative; }
.thumb[aria-current="true"] { border-color: var(--paper); }
.thumb .v { position: absolute; right: 2px; bottom: 1px; font-size: 9px; text-shadow: 0 0 3px #000; }
.addmore { flex: 0 0 auto; width: 34px; height: 60px; border-radius: 6px; border: 1.5px dashed rgba(255,255,255,.55); display: grid; place-items: center; font-size: 22px; font-weight: 500; color: rgba(255,255,255,.8); }
.sharebtn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; background: var(--paper); color: var(--ink); font-weight: 700; font-size: 15px; padding: 12px 18px; border-radius: 999px; }
.sharebtn svg { width: 16px; height: 16px; }

/* text editor overlay */
.texted { position: fixed; inset: 0; background: var(--veil); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
.texted .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px; }
.texted .done { font-weight: 700; font-size: 17px; padding: 8px 6px; }
.bgtoggle { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--paper); font-weight: 800; font-size: 17px; display: grid; place-items: center; }
.bgtoggle[data-bg="black"] { background: var(--ink); color: var(--paper); }
.bgtoggle[data-bg="white"] { background: var(--paper); color: var(--ink); }
.texted .mid { flex: 1; display: grid; place-items: center; padding: 16px; overflow: auto; }
#edText { display: inline-block; min-width: 1ch; max-width: 86vw; text-align: center; font-size: 34px; line-height: 1.18; padding: 10px 22px; border-radius: 26px; outline: none; white-space: pre-wrap; word-break: break-word; caret-color: var(--paper); user-select: text; -webkit-user-select: text; }
#edText:empty::before { content: attr(data-ph); opacity: .45; }
#edText[data-bg="black"] { background: rgba(0,0,0,.93); color: var(--paper); }
#edText[data-bg="white"] { background: var(--paper); color: var(--ink); caret-color: var(--ink); }
#edText[data-bg="none"] { background: transparent; color: var(--paper); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.fonts { display: flex; gap: 8px; padding: 0 12px 6px; overflow-x: auto; scrollbar-width: none; }
.fonts::-webkit-scrollbar { display: none; }
.fonts button { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 700; }
.fonts button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

/* action sheet + busy + toast */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.sheet .box { width: 100%; max-width: 420px; display: grid; gap: 8px; }
.sheet .grp { background: #2a2a2c; border-radius: 14px; overflow: hidden; display: grid; }
.sheet .grp p { margin: 0; padding: 14px 16px 10px; font-size: 13px; color: rgba(255,255,255,.6); text-align: center; }
.sheet .grp button { padding: 16px; font-size: 17px; font-weight: 600; border-top: 1px solid rgba(255,255,255,.1); color: #4ea1ff; }
.sheet .grp button.red { color: #ff6961; }
.sheet .cancel { background: #2a2a2c; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 700; color: #4ea1ff; }
#busy { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: grid; place-items: center; z-index: 30; padding-inline: 24px; }
#busy .box { width: min(300px, 100%); display: grid; gap: 12px; text-align: center; }
#busy .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
#busy .bar i { display: block; height: 100%; width: 0; background: var(--paper); }
#busy small { color: rgba(255,255,255,.6); }
#busy button { justify-self: center; padding: 8px 16px; border-radius: 999px; background: var(--chip); font-weight: 600; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: rgba(40,40,42,.95); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .shutter::after, .trash { transition: none; } }
</style>
</head>
<body>

<input id="camIn" type="file" accept="image/*,video/*" capture="environment" hidden>
<input id="libIn" type="file" accept="image/*,video/*" multiple hidden>

<section class="screen start" id="startScreen">
  <div class="brand">Ma Liaison<span></span></div>
  <div class="mid">
    <p id="intro" style="align-self:center">Take a photo or video of the item, or pick some from your library. Several photos make a TikTok slideshow.</p>
    <div class="recent" id="recent" hidden>
      <header><h2>Recent photos</h2><small id="recentHint">Tap photos to pick them for a TikTok slideshow</small></header>
      <div class="rgrid" id="rgrid"></div>
      <div class="ractions" id="ractions" hidden>
        <button class="ghost" id="rDelete">Delete</button>
        <button class="sharebtn" id="rShare">Share</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="libbtn" id="libBtn" aria-label="Choose from library">
      <i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></i>
      Library
    </button>
    <div><button class="shutter" id="camBtn" aria-label="Open camera"></button><span class="shutlabel">Camera</span></div>
    <span></span>
  </div>
</section>

<section class="screen" id="editScreen" hidden>
  <div class="stagebox" id="stagebox">
    <div class="frame" id="frame">
      <canvas id="stage" width="1080" height="1920" aria-label="Story. Tap to add a price, drag text to move it, pinch to resize or turn it, pinch the picture to zoom."></canvas>
      <div class="topbar">
        <button class="ico" id="closeBtn" aria-label="Discard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="right">
          <button class="ico" id="soundBtn" aria-label="Sound" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundWaves" d="M23 9l-6 6M17 9l6 6"/></svg>
          </button>
          <button class="ico aa" id="textBtn" aria-label="Add price">Aa</button>
        </div>
      </div>
      <div class="trash" id="trash" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </div>
    </div>
  </div>
  <div class="bottombar">
    <div class="strip" id="strip"></div>
    <button class="sharebtn" id="shareBtn">Share
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<section class="texted" id="textEd" hidden>
  <div class="bar">
    <button class="bgtoggle" id="bgToggle" data-bg="black" aria-label="Text background">A</button>
    <button class="done" id="doneBtn">Done</button>
  </div>
  <div class="fonts" role="group" aria-label="Lettering"></div>
  <div class="mid"><div id="edText" contenteditable="true" data-ph="135$" data-bg="black" role="textbox" aria-multiline="true" aria-label="Price text"></div></div>
</section>

<div class="sheet" id="sheet" hidden><div class="box"><div class="grp" id="sheetGrp"></div><button class="cancel" id="sheetCancel">Cancel</button></div></div>
<div id="busy" hidden><div class="box"><strong id="busyTitle">Preparing video</strong><div class="bar"><i id="busyBar"></i></div><small>Keep this screen open.</small><button id="busyCancel">Cancel</button></div></div>
<div id="toast" hidden></div>

<script>
(() => {
  const W = 1080, H = 1920;
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const stage = $('#stage');
  const ctx = stage.getContext('2d');
  let uid = 0;

  const state = { items: [], cur: -1, editing: null, style: { font: 'story', bg: 'black' } };
  const cur = () => state.items[state.cur] || null;
  let dirty = true;
  const touch = () => { dirty = true; };

  // ---------- drawing ----------
  function mediaSize(el) {
    if (el.videoWidth) return [el.videoWidth, el.videoHeight];
    return [el.naturalWidth || el.width, el.naturalHeight || el.height];
  }
  const blurC = document.createElement('canvas');
  blurC.width = 18; blurC.height = 32;
  const bctx = blurC.getContext('2d');

  function baseScale(item, el) { const [mw, mh] = mediaSize(el); return Math.min(W / mw, H / mh); }
  function coverZoom(el) { const [mw, mh] = mediaSize(el); return Math.max(W / mw, H / mh) / Math.min(W / mw, H / mh); }

  function drawBackground(c, item, el) {
    c.fillStyle = '#000';
    c.fillRect(0, 0, W, H);
    const [mw, mh] = mediaSize(el);
    if (!mw || !mh) return;
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
    const s = baseScale(item, el) * item.zoom;
    const dw = mw * s, dh = mh * s;
    if (dw < W - 1 || dh < H - 1) {
      const bs = Math.max(blurC.width / mw, blurC.height / mh);
      bctx.drawImage(el, (blurC.width - mw * bs) / 2, (blurC.height - mh * bs) / 2, mw * bs, mh * bs);
      c.drawImage(blurC, 0, 0, W, H);
      c.fillStyle = 'rgba(0,0,0,.2)';
      c.fillRect(0, 0, W, H);
    }
    const mx = Math.max(0, (dw - W) / 2) + W * 0.25, my = Math.max(0, (dh - H) / 2) + H * 0.25;
    item.pan.x = clamp(item.pan.x, -mx, mx);
    item.pan.y = clamp(item.pan.y, -my, my);
    c.drawImage(el, (W - dw) / 2 + item.pan.x, (H - dh) / 2 + item.pan.y, dw, dh);
  }

  // Lettering styles. "story" matches the handwritten italic already used on @ma.liaison stories.
  const FONTS = {
    story: { label: 'Story', style: 'italic', weight: 400, family: 'Kalam, "Bradley Hand", cursive', k: 1 },
    classic: { label: 'Classic', style: 'normal', weight: 500, family: 'Manrope, system-ui, -apple-system, sans-serif', k: 1 },
    modern: { label: 'Modern', style: 'normal', weight: 400, family: 'Jost, "Avenir Next", sans-serif', k: 1.02 },
    hand: { label: 'Hand', style: 'normal', weight: 500, family: 'Caveat, "Bradley Hand", cursive', k: 1.2 },
    signature: { label: 'Signature', style: 'normal', weight: 500, family: '"Dancing Script", "Snell Roundhand", cursive', k: 1.15 },
    elegant: { label: 'Elegant', style: 'italic', weight: 500, family: '"Cormorant Garamond", Georgia, serif', k: 1.15 },
    typewriter: { label: 'Typewriter', style: 'normal', weight: 400, family: '"Courier Prime", "Courier New", monospace', k: 0.95 },
    strong: { label: 'Strong', style: 'normal', weight: 500, family: 'Oswald, "Arial Narrow", sans-serif', k: 1 },
  };
  function fontFor(f, size) {
    const d = FONTS[f] || FONTS.story;
    return `${d.style} ${d.weight} ${Math.round(size * d.k)}px ${d.family}`;
  }
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function drawSticker(c, st) {
    const size = 72 * st.scale;
    c.font = fontFor(st.font, size);
    let lines = st.text.split('\n');
    while (lines.length > 1 && !lines[lines.length - 1].trim()) lines.pop();
    const lh = size * 1.18;
    const tw = Math.max(...lines.map((l) => c.measureText(l).width), size * 0.6);
    const w = tw + size * 1.2, h = lines.length * lh + size * 0.5;
    st._w = w; st._h = h;
    c.save();
    c.translate(st.x, st.y);
    c.rotate(st.rot);
    if (st.bg !== 'none') {
      roundRectPath(c, -w / 2, -h / 2, w, h, Math.min(h / 2, size * 0.75));
      c.fillStyle = st.bg === 'white' ? '#fff' : 'rgba(0,0,0,0.93)';
      c.fill();
    } else {
      c.shadowColor = 'rgba(0,0,0,.55)';
      c.shadowBlur = size * 0.18;
    }
    c.fillStyle = st.bg === 'white' ? '#000' : '#fff';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    lines.forEach((l, i) => c.fillText(l, 0, -h / 2 + size * 0.25 + lh * (i + 0.5) + size * 0.04));
    c.restore();
  }
  function drawScene(c, item, el, skip) {
    drawBackground(c, item, el || item.el);
    for (const st of item.stickers) if (st !== skip) drawSticker(c, st);
  }
  function loop() {
    const item = cur();
    if (item && (dirty || item.kind === 'video')) { drawScene(ctx, item, null, state.editing); dirty = false; }
    requestAnimationFrame(loop);
  }

  // ---------- layout ----------
  function fitFrame() {
    const box = $('#stagebox');
    const aw = box.clientWidth - 16, ah = box.clientHeight - 8;
    let w = aw, h = aw * 16 / 9;
    if (h > ah) { h = ah; w = ah * 9 / 16; }
    const f = $('#frame');
    f.style.width = Math.floor(w) + 'px';
    f.style.height = Math.floor(h) + 'px';
  }
  new ResizeObserver(fitFrame).observe($('#stagebox'));

  // ---------- items ----------
  function thumbOf(el) {
    const c = document.createElement('canvas');
    c.width = 68; c.height = 120;
    const k = c.getContext('2d');
    const [mw, mh] = mediaSize(el);
    if (mw && mh) { const s = Math.max(68 / mw, 120 / mh); k.drawImage(el, (68 - mw * s) / 2, (120 - mh * s) / 2, mw * s, mh * s); }
    return c.toDataURL('image/jpeg', 0.7);
  }
  function once(el, ev) { return new Promise((res, rej) => { el.addEventListener(ev, res, { once: true }); el.addEventListener('error', rej, { once: true }); }); }

  async function addFile(f) {
    const url = URL.createObjectURL(f);
    let el, kind;
    if ((f.type || '').startsWith('video')) {
      kind = 'video';
      el = document.createElement('video');
      el.muted = true; el.playsInline = true; el.loop = true; el.preload = 'auto';
      el.setAttribute('playsinline', '');
      el.src = url;
      await once(el, 'loadeddata');
    } else {
      kind = 'image';
      el = new Image();
      el.src = url;
      await el.decode();
    }
    const [mw, mh] = mediaSize(el);
    const nearStory = Math.abs(mw / mh - 9 / 16) < 0.09;
    const item = { id: ++uid, kind, file: f, url, el, zoom: nearStory ? coverZoom(el) : 1, pan: { x: 0, y: 0 }, stickers: [], thumb: thumbOf(el) };
    state.items.push(item);
  }
  async function addFiles(files) {
    if (!files.length) return;
    const first = state.items.length;
    let failed = 0;
    for (const f of files) { try { await addFile(f); } catch { failed++; } }
    if (failed) toast(`${failed} file${failed > 1 ? 's' : ''} could not be opened`);
    if (state.items.length > first) { showEditor(true); selectItem(first); }
  }
  function showEditor(on) {
    $('#startScreen').hidden = on;
    $('#editScreen').hidden = !on;
    if (on) fitFrame(); else renderRecent();
  }
  function selectItem(i) {

    }
    item.done = { key, file };
    return file;
  }
  async function shareCurrent(target) {
    const item = cur();
    try {
      const file = await finished(item, state.cur);
      if (file) await sendTo(target, [file]);
    } catch (e) {
      toast(e && e.message ? e.message : 'Could not create the file');
    } finally {
      if (item.kind === 'video' && cur() === item) item.el.play().catch(() => {});
    }
  }
  async function shareAllPhotos() {
    try {
      const files = [];
      for (const [i, it] of state.items.entries()) if (it.kind === 'image') files.push(await finished(it, i));
      await sendTo('tiktok', files);
    } catch { toast('Could not create the photos'); }
  }
  $('#shareBtn').onclick = () => {
    const photos = state.items.filter((i) => i.kind === 'image').length;
    const acts = [
      { label: 'Instagram Story', fn: () => shareCurrent('instagram') },
      { label: 'TikTok', fn: () => shareCurrent('tiktok') },
    ];
    if (photos > 1) acts.push({ label: `All ${photos} photos to TikTok (slideshow)`, fn: shareAllPhotos });
    acts.push({ label: 'Save or other apps', fn: () => shareCurrent('other') });
    sheet(null, acts);
  };

  // ---------- start ----------
  setEdStyle();
  renderRecent();
  requestAnimationFrame(loop);
  if (document.fonts) {
    Promise.all(Object.keys(FONTS).map((k) => document.fonts.load(fontFor(k, 72)))).then(touch).catch(() => {});
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
